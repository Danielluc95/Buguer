<html>
    <head>
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <link rel="stylesheet" href="css/reset.css">
        <link rel="stylesheet" href="css/padrao.css">
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <header class="fxw">
            <div class="col-3">
                <img class="col-5" src="img/Black Pink Food Marketing Business Restaurant Burger Logo.png">

            </div>
            <div class="col-9 direita">
                <img class="col-2" src="img/icons8-whatsapp-94.png">
                <img class="col-2" src="img/icons8-carrinho-60.png">

            </div>
        </header>
        <section class="s1 fxw">
            <h1 class="centraliza col-12">
                Nossos destaques
            </h1>
            <div class="col-2 centraliza">
                <img class="col-10" src="img/lanche destaque/almoço.jpg">
            </div>
            <div class="col-2 centraliza">
                <img class="col-10" src="img/lanche destaque/coxinha.webp">
            </div>
            <div class="col-2 centraliza">
                <img class="col-10" src="img/lanche destaque/crepe.jpg">
            </div>
            <div class="col-2 centraliza">
                <img class="col-10" src="img/lanche destaque/sanduiche.jpg">
            </div>
            <div class="col-2 centraliza">
                <img class="col-10" src="img/lanche destaque/tortas.jpg">
            </div>
            <div class="col-2 centraliza">
                <img class="col-10" src="img/lanche destaque/vitamina.webp">
            </div>
        </section>
        <section class="s2">
            <div class="slider">
                <div class="slider_principal ">
                    <input type="radio" name="bola" id="bola1">
                    <input type="radio" name="bola" id="bola2">
                
                    <div class="col-12 slidee primeiro">
                        <img class="col-12 " src="img/lanche destaque/lanche1.jpg">

                    </div>
                    <div class="col-12 slidee">
                        <img class="col-12" src="img/lanche destaque/lanche2.jpg">
                    </div>

                </div>
                <div class="quadradinhos">
                    <label for="bola1"><img src="img/lanche destaque/icons8-sanduíche-64.png"></label>
                    <label for="bola2"><img src="img/lanche destaque/icons8-sanduíche-64.png" alt=""></label>

                </div>
                
            </div>

        </section>
        <section class="s3">
            <h1>Escolha seu sanduiche</h1>
            <select id="sanduiche">
                <option value="Sanduiche1">Sanduiche 1</option>
                <option value="Sanduiche2">Sanduiche 2</option>
                <option value="Sanduiche3">Sanduiche 3</option>
                <option value="Sanduiche4">Sanduiche 4</option>
                <option value="Sanduiche5">Sanduiche 5</option>
                <option value="Sanduiche6">Sanduiche 6</option>
            </select>
            <h1>Escolha seu adicional</h1>
            <select id="adicional">
                <option value="Frango">Frango</option>
                <option value="Ovo">Ovo</option>
                <option value="Bacon">Bacon</option>
            </select>
            <div id="resposta"></div>
        </section>

    </body>
    <script src="script.js"></script>
</html>
